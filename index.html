<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOCTULLA</title>

<style>
  /* ============================================================
     CUSTOMIZE ME: change these and the whole page updates.
     ============================================================ */
  :root {
    --color-bg: #008080;      /* Windows 95 teal desktop background */
    --color-ink: #1E2A24;     /* text color + icon button background */
    --color-accent: #4B6B58;  /* icon button hover color */
    --color-muted: #6E7A73;   /* secondary text */

    --font-body: 'Helvetica Neue', Arial, sans-serif;
    --max-width: 480px;
    --icon-size: 46px;        /* size of each icon button */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; /* keep the draggable windows from creating scrollbars */
    padding-bottom: 36px; /* leave room above the taskbar */
  }

  .wrap {
    max-width: var(--max-width);
    padding: 2rem 1.5rem;
  }

  h1 {
    font-size: 1.6rem;
    margin: 0 0 0.75rem;
    letter-spacing: -0.01em;
    color: #ffffff;
    text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35);
  }

  p.intro {
    color: var(--color-muted);
    margin: 0 0 2rem;
    font-size: 1.05rem;
  }

  /* ============================================================
     Draggable window — Windows 95 style chrome
     ============================================================ */
  #links-window,
  #about-window,
  #message-window,
  #welcome-window {
    position: fixed;
    background: #C0C0C0;
    border-radius: 0;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #dfdfdf,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #ffffff;
    padding: 3px;
    user-select: none;
    width: max-content;
  }

  #links-window {
    top: 68%;
    left: 62%;
    transform: translate(-50%, -50%);
  }

  #about-window {
    top: 32%;
    left: 38%;
    transform: translate(-50%, -50%);
  }

  #welcome-window {
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
  }

  #draw-window {
    top: 45%;
    left: 40%;
    transform: translate(-50%, -50%);
    position: fixed;
    background: #C0C0C0;
    border-radius: 0;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #dfdfdf,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #ffffff;
    padding: 3px;
    user-select: none;
    width: max-content;
  }

  #draw-window .window-body {
    background: #ffffff;
    margin: 3px;
    padding: 0.9rem;
    width: 260px;
    box-shadow:
      inset 1px 1px 0 #808080,
      inset -1px -1px 0 #ffffff;
  }

  .msg-canvas {
    width: 100%;
    height: 120px;
    background: #ffffff;
    cursor: crosshair;
    margin-bottom: 0.2rem;
    box-shadow:
      inset 1px 1px 0 #0a0a0a,
      inset -1px -1px 0 #dfdfdf,
      inset 2px 2px 0 #808080,
      inset -2px -2px 0 #ffffff;
  }

  .canvas-tools {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 0.7rem;
  }

  .color-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 0px;
  padding: 4px;
  background: #c0c0c0;
  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-right: 2px solid #ffffff;
  border-bottom: 2px solid #ffffff;
}

.color-swatch {
  width: 16px;
  height: 16px;
  padding: 0;
  border-top: 1px solid #000000;
  border-left: 1px solid #000000;
  border-right: 1px solid #ffffff;
  border-bottom: 1px solid #ffffff;
  cursor: pointer;
  box-sizing: border-box;
}

.color-swatch:hover {
  outline: 1px solid #000;
}

.color-swatch.active {
  border-top: 2px solid #000000;
  border-left: 2px solid #000000;
  border-right: 2px solid #dfdfdf;
  border-bottom: 2px solid #dfdfdf;
  outline: 1px solid #ffffff;
}

.brush-sizes {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%; /* Forces brushes to take up the entire top row */
  margin-bottom: 0px; /* Adds a clean gap between brushes and the color swatches below */
}

.brush-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  background: #c0c0c0;
  border-top: 1px solid #ffffff;
  border-left: 1px solid #ffffff;
  border-right: 1px solid #000000;
  border-bottom: 1px solid #000000;
  cursor: pointer;
}

.brush-btn:active,
.brush-btn.active {
  border-top: 1px solid #000000;
  border-left: 1px solid #000000;
  border-right: 1px solid #ffffff;
  border-bottom: 1px solid #ffffff;
  background: #dfdfdf;
}

.dot {
  background-color: #000000;
  border-radius: 50%;
  display: inline-block;
}

.dot-small {
  width: 3px;
  height: 3px;
}

.dot-medium {
  width: 6px;
  height: 6px;
}

.dot-large {
  width: 10px;
  height: 10px;
}

  .btn-clear {
    font-size: 0.7rem;
    padding: 2px 8px;
    background: #C0C0C0;
    border: none;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
  }
  
  .btn-clear:active {
    box-shadow: inset 1px 1px 0 #0a0a0a, inset -1px -1px 0 #ffffff;
  }

  .window-titlebar {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 3px 3px 3px 6px;
    background: linear-gradient(90deg, #000080, #1084d0);
    cursor: grab;
  }

  .window-titlebar:active {
    cursor: grabbing;
  }

  .window-titlebar .title {
    flex: 1;
    color: #ffffff;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .titlebar-buttons {
    display: flex;
    gap: 2px;
  }

  .titlebar-buttons button {
    width: 16px;
    height: 14px;
    background: #C0C0C0;
    border: none;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
    font-family: Tahoma, sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    line-height: 1;
    color: #000000;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  .titlebar-buttons button:active {
    box-shadow:
      inset 1px 1px 0 #0a0a0a,
      inset -1px -1px 0 #ffffff;
  }

  .window-body {
    padding: 0.9rem;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
  }

  #about-window .window-body {
    max-width: 280px;
    font-size: 0.85rem;
    color: #000000;
    background: #ffffff;
    margin: 3px;
    padding: 0.9rem;
    box-shadow:
      inset 1px 1px 0 #808080,
      inset -1px -1px 0 #ffffff;
  }

  #about-window .window-body p {
    margin: 0;
  }

  #welcome-window .window-body {
      max-width: 280px;
      font-size: 0.85rem;
      color: #000;
      background: #ffffff;
      margin: 3px;
      padding: 0.9rem;
      box-shadow:
      inset 1px 1px 0 #808080,
      inset -1px -1px 0 #ffffff;
  }

  #welcome-window .window-body p {
      margin: 0;
  }

  /* ---------- Message window (send-to-Discord form) ---------- */
  #message-window {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  #message-window .window-body {
    background: #ffffff;
    margin: 3px;
    padding: 0.9rem;
    width: 260px;
    box-shadow:
      inset 1px 1px 0 #808080,
      inset -1px -1px 0 #ffffff;
  }

  .msg-field {
    display: block;
    font-size: 0.78rem;
    margin-bottom: 3px;
    color: #000000;
  }

  .msg-input,
  .msg-textarea {
    width: 100%;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
    font-size: 0.8rem;
    padding: 4px 5px;
    margin-bottom: 0.7rem;
    border: none;
    background: #ffffff;
    box-shadow:
      inset -1px -1px 0 #ffffff,
      inset 1px 1px 0 #808080,
      inset -2px -2px 0 #dfdfdf,
      inset 2px 2px 0 #0a0a0a;
  }

  .msg-textarea {
    resize: vertical;
    min-height: 70px;
  }

  .msg-send {
    display: block;
    margin-left: auto;
    padding: 4px 14px;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
    font-size: 0.8rem;
    background: #C0C0C0;
    border: none;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
    cursor: default;
  }

  .msg-send:active {
    box-shadow:
      inset 1px 1px 0 #0a0a0a,
      inset -1px -1px 0 #ffffff;
  }

  .msg-status {
    margin-top: 0.6rem;
    font-size: 0.75rem;
    color: var(--color-muted);
    min-height: 1em;
  }

  #minesweeper-window {
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
  }

  #minesweeper-window .window-body {
    padding: 6px;
    background: #c0c0c0;
  }

  .minesweeper-container {
    background: #c0c0c0;
    padding: 6px;
    border-top: 2px solid #ffffff;
    border-left: 2px solid #ffffff;
    border-right: 2px solid #808080;
    border-bottom: 2px solid #808080;
  }

  .ms-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
    margin-bottom: 6px;
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
    background: #c0c0c0;
  }

  .ms-counter {
    background: #000000;
    color: #ff0000;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 1.1rem;
    padding: 1px 3px;
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid #ffffff;
    border-bottom: 1px solid #ffffff;
    letter-spacing: 1px;
  }

  .ms-face-btn {
    width: 26px;
    height: 26px;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    background: #c0c0c0;
    border: none;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
    cursor: pointer;
  }

  .ms-face-btn:active {
    box-shadow: inset 1px 1px 0 #0a0a0a, inset -1px -1px 0 #ffffff;
  }

  .ms-board {
    display: grid;
    grid-template-columns: repeat(9, 20px);
    grid-template-rows: repeat(9, 20px);
    gap: 0;
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
  }

  .ms-cell {
    width: 20px;
    height: 20px;
    background-image: url('Tile_Map_Classic.png');
    /* 512x128 sprite sheet scaled down to match 20px tiles (512 * 0.3125 = 160px, 128 * 0.3125 = 40px) */
    background-size: 160px 40px;
    /* Default: Covered / Unrevealed Tile (Column 2) */
    background-position: -40px 0px;
    cursor: pointer;
    user-select: none;
  }

  /* Sprite Tile Mapping */
  .ms-cell.flagged { background-position: -100px 0px; }            /* Flag Tile (Col 5) */
  .ms-cell.revealed-empty { background-position: 0px 0px; }       /* Flat Blank Tile (Col 0) */
  .ms-cell.mine-revealed { background-position: -80px 0px; }        /* Black Mine (Col 4) */
  .ms-cell.mine-hit { background-position: -120px 0px; }           /* Red Exploded Mine (Col 6) */

  /* Number Tiles 1 to 8 (Row 2 on the sprite map) */
  .ms-cell[data-num="1"] { background-position: 0px -20px; }
  .ms-cell[data-num="2"] { background-position: -20px -20px; }
  .ms-cell[data-num="3"] { background-position: -40px -20px; }
  .ms-cell[data-num="4"] { background-position: -60px -20px; }
  .ms-cell[data-num="5"] { background-position: -80px -20px; }
  .ms-cell[data-num="6"] { background-position: -100px -20px; }
  .ms-cell[data-num="7"] { background-position: -120px -20px; }
  .ms-cell[data-num="8"] { background-position: -140px -20px; }

  .ms-cell.revealed {
    border: 1px solid #7b7b7b;
    background: #c0c0c0;
    box-sizing: border-box;
  }

  /* Classic Minesweeper digit colors */
  .ms-cell[data-num="1"] { color: #0000ff; }
  .ms-cell[data-num="2"] { color: #008000; }
  .ms-cell[data-num="3"] { color: #ff0000; }
  .ms-cell[data-num="4"] { color: #000080; }
  .ms-cell[data-num="5"] { color: #800000; }
  .ms-cell[data-num="6"] { color: #008080; }
  .ms-cell[data-num="7"] { color: #000000; }
  .ms-cell[data-num="8"] { color: #808080; }

  /* Windows start closed; JS toggles this via inline display */
  #links-window,
  #about-window,
  #message-window,
  #draw-window {
    display: none;
  }

  /* ============================================================
     Taskbar — Windows 95 style
     ============================================================ */
  .taskbar {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 36px;
    background: #C0C0C0;
    box-shadow: inset 0 1px 0 #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 4px;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
    z-index: 10;
  }

  .taskbar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 28px;
    padding: 0 10px;
    background: #C0C0C0;
    border: none;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
    font-family: inherit;
    font-size: 0.78rem;
    color: #000000;
    cursor: default;
  }

  .taskbar-btn.start {
    font-weight: 700;
  }

  .taskbar-apps .taskbar-btn {
    width: 32px;
    padding: 0;
  }

  .taskbar-apps .taskbar-btn svg {
    width: 16px;
    height: 16px;
  }

  .taskbar-btn.open {
    box-shadow:
      inset 1px 1px 0 #0a0a0a,
      inset -1px -1px 0 #ffffff;
  }

  .taskbar-divider {
    width: 2px;
    height: 26px;
    box-shadow: inset -1px 0 0 #0a0a0a, inset 1px 0 0 #808080;
  }

  .taskbar-apps {
    display: flex;
    gap: 4px;
    flex: 1;
    overflow: hidden;
  }

  .taskbar-clock {
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 10px;
    box-shadow:
      inset 1px 1px 0 #808080,
      inset -1px -1px 0 #ffffff;
    font-size: 0.78rem;
  }

  /* ---------- Icon links ---------- */

  .links-container {
  background: #ffffff;
  padding: 24px;
  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-right: 2px solid #ffffff;
  border-bottom: 2px solid #ffffff;
  box-sizing: border-bottom;
}

  ul.links {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem;
  }

  ul.links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--icon-size);
    height: var(--icon-size);
    background: #C0C0C0;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
    text-decoration: none;
  }

  ul.links a:active {
    box-shadow:
      inset 1px 1px 0 #0a0a0a,
      inset -1px -1px 0 #ffffff;
    padding-top: 2px;
    padding-left: 2px;
  }

  ul.links svg {
    width: 22px;
    height: 22px;
    fill: #000000; 
  }

  ul.links a:focus-visible {
    outline: 1px dotted #000000;
    outline-offset: -4px;
  }
</style>
</head>

<script>
const BACKEND_URL = 'https://website-backend.noctulla.workers.dev';

document.addEventListener('DOMContentLoaded', () => {

  // ==========================================
  // 1. TEXT MESSAGE WINDOW
  // ==========================================
  const msgForm = document.getElementById('message-form');
  const msgStatus = document.getElementById('msg-status');

  if (msgForm) {
    msgForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('msg-name').value.trim();
      const body = document.getElementById('msg-body').value.trim();

      if (!name || !body) return;
      msgStatus.textContent = 'Sending...';

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, message: body })
        });

        if (res.ok) {
          msgStatus.textContent = 'Sent!';
          msgForm.reset();
        } else {
          msgStatus.textContent = `Error ${res.status}`;
        }
      } catch (err) {
        msgStatus.textContent = 'Network error.';
      }
    });
  }

  // ==========================================
  // 2. PAINT / DRAWING WINDOW
  // ==========================================
  const drawForm = document.getElementById('draw-form');
  const drawStatus = document.getElementById('draw-status');
  const canvas = document.getElementById('paint-canvas');

  if (drawForm && canvas) {
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('btn-clear');
    const colorSwatches = document.querySelectorAll('.color-swatch');
    const brushBtns = document.querySelectorAll('.brush-btn');

    let isDrawing = false;
    let hasDrawn = false;
    let currentColor = '#000000';

    // Default brush styling
    ctx.lineWidth = 5; // Default medium brush
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = currentColor;

    // Color Swatch Selection
    colorSwatches.forEach((swatch) => {
      swatch.addEventListener('click', (e) => {
        currentColor = e.target.getAttribute('data-color');
        ctx.strokeStyle = currentColor;

        colorSwatches.forEach(s => s.classList.remove('active'));
        e.target.classList.add('active');
      });
    });

    // Brush Size Selection
    brushBtns.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        const targetBtn = e.target.closest('.brush-btn');
        if (!targetBtn) return;

        const newSize = parseInt(targetBtn.getAttribute('data-size'), 10);
        ctx.lineWidth = newSize;

        brushBtns.forEach(b => b.classList.remove('active'));
        targetBtn.classList.add('active');
      });
    });

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      // Calculate the scale ratios (internal resolution vs rendered screen size)
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      hasDrawn = true;
      const pos = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault(); 
      const pos = getCoords(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        ctx.closePath();
      }
    }

    // Mouse events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Touch events for mobile/tablets
    canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    // Clear canvas button
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasDrawn = false;
      });
    }

    // Submit form logic
    drawForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('draw-name').value.trim();

      if (!name || !hasDrawn) {
        drawStatus.textContent = 'Please draw something first!';
        return;
      }

      // Create off-screen canvas to bake white background
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      exportCtx.fillStyle = '#ffffff';
      exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      exportCtx.drawImage(canvas, 0, 0);

      const imageData = exportCanvas.toDataURL('image/png');
      drawStatus.textContent = 'Sending art...';

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            message: "*Sent a drawing!*",
            image: imageData
          })
        });

        if (res.ok) {
          drawStatus.textContent = 'Sent!';
          drawForm.reset();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          hasDrawn = false;
        } else {
          drawStatus.textContent = `Error ${res.status}`;
        }
      } catch (err) {
        drawStatus.textContent = 'Network error.';
      }
    });
  }

  // ==========================================
  // MINESWEEPER GAME LOGIC (Tile Map Edition)
  // ==========================================
  const boardEl = document.getElementById('ms-board');
  const resetBtn = document.getElementById('ms-reset-btn');
  const mineCountEl = document.getElementById('ms-mine-count');
  const timerEl = document.getElementById('ms-timer');

  if (boardEl) {
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let cells = [];
    let boardState = [];
    let gameStarted = false;
    let gameOver = false;
    let flagsCount = 0;
    let timerInterval = null;
    let seconds = 0;

    function initMinesweeper() {
      clearInterval(timerInterval);
      seconds = 0;
      flagsCount = 0;
      gameStarted = false;
      gameOver = false;

      timerEl.textContent = '000';
      mineCountEl.textContent = String(MINES).padStart(3, '0');
      resetBtn.textContent = ':)';

      boardEl.innerHTML = '';
      cells = [];
      boardState = [];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const idx = r * COLS + c;
          boardState.push({
            row: r,
            col: c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0
          });

          const cellEl = document.createElement('div');
          cellEl.classList.add('ms-cell');
          cellEl.dataset.index = idx;

          cellEl.addEventListener('click', () => handleCellClick(idx));
          cellEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleCellRightClick(idx);
          });

          boardEl.appendChild(cellEl);
          cells.push(cellEl);
        }
      }
    }

    function generateMines(firstClickIdx) {
      let planted = 0;
      while (planted < MINES) {
        const randIdx = Math.floor(Math.random() * (ROWS * COLS));
        if (randIdx !== firstClickIdx && !boardState[randIdx].mine) {
          boardState[randIdx].mine = true;
          planted++;
        }
      }

      for (let i = 0; i < boardState.length; i++) {
        if (boardState[i].mine) continue;
        const neighbors = getNeighbors(i);
        boardState[i].count = neighbors.filter(nIdx => boardState[nIdx].mine).length;
      }
    }

    function getNeighbors(idx) {
      const { row, col } = boardState[idx];
      const neighbors = [];

      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = row + dr;
          const nc = col + dc;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
            neighbors.push(nr * COLS + nc);
          }
        }
      }
      return neighbors;
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        seconds++;
        if (seconds > 999) seconds = 999;
        timerEl.textContent = String(seconds).padStart(3, '0');
      }, 1000);
    }

    function handleCellClick(idx) {
      if (gameOver || boardState[idx].flagged || boardState[idx].revealed) return;

      if (!gameStarted) {
        gameStarted = true;
        generateMines(idx);
        startTimer();
      }

      revealCell(idx);
      checkWinCondition();
    }

    function handleCellRightClick(idx) {
      if (gameOver || boardState[idx].revealed) return;

      const cell = boardState[idx];
      cell.flagged = !cell.flagged;
      flagsCount += cell.flagged ? 1 : -1;

      const remainingMines = MINES - flagsCount;
      mineCountEl.textContent = String(Math.max(-99, remainingMines)).padStart(3, '0');

      if (cell.flagged) {
        cells[idx].classList.add('flagged');
      } else {
        cells[idx].classList.remove('flagged');
      }
    }

    function revealCell(idx) {
      const cell = boardState[idx];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      const el = cells[idx];

      if (cell.mine) {
        el.classList.add('mine-hit');
        triggerGameOver(false);
        return;
      }

      if (cell.count > 0) {
        el.dataset.num = cell.count;
      } else {
        el.classList.add('revealed-empty');
        const neighbors = getNeighbors(idx);
        neighbors.forEach(nIdx => revealCell(nIdx));
      }
    }

    function triggerGameOver(won) {
      gameOver = true;
      clearInterval(timerInterval);
      resetBtn.textContent = won ? ':D' : 'X(';

      boardState.forEach((cell, idx) => {
        if (cell.mine && !won) {
          if (!cells[idx].classList.contains('mine-hit')) {
            cells[idx].classList.add('mine-revealed');
          }
        }
      });
    }

    function checkWinCondition() {
      if (gameOver) return;

      const unrevealedNonMines = boardState.filter(c => !c.mine && !c.revealed).length;
      if (unrevealedNonMines === 0) {
        triggerGameOver(true);
      }
    }

    resetBtn.addEventListener('click', initMinesweeper);
    initMinesweeper();
  }

  // ============================================================
  // Drag behavior for windows.
  // ============================================================
  let highestZ = 100;
  
  document.querySelectorAll('#about-window, #links-window, #message-window, #welcome-window, #draw-window, #minesweeper-window').forEach(makeDraggable);

  function makeDraggable(win) {
    const bar = win.querySelector('[data-drag-handle]');
    if (!bar) return;

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    win.addEventListener('mousedown', () => {
      win.style.zIndex = ++highestZ;
    });

    win.addEventListener('touchstart', () => {
      win.style.zIndex = ++highestZ;
    }, { passive: true });

    function startDrag(clientX, clientY) {
      const rect = win.getBoundingClientRect();
      win.style.zIndex = ++highestZ;
      dragging = true;
      offsetX = clientX - rect.left;
      offsetY = clientY - rect.top;
      win.style.left = rect.left + 'px';
      win.style.top = rect.top + 'px';
      win.style.transform = 'none';
    }

    function moveDrag(clientX, clientY) {
      if (!dragging) return;
      const maxX = window.innerWidth - win.offsetWidth;
      const maxY = window.innerHeight - win.offsetHeight;
      const x = Math.min(Math.max(0, clientX - offsetX), maxX);
      const y = Math.min(Math.max(0, clientY - offsetY), maxY);
      win.style.left = x + 'px';
      win.style.top = y + 'px';
    }

    function endDrag() {
      dragging = false;
    }

    bar.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    bar.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      startDrag(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      moveDrag(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchend', endDrag);
  }

  // ============================================================
  // Taskbar: open/close windows.
  // ============================================================
  const taskbarButtons = document.querySelectorAll('.taskbar-btn[data-target]');

  taskbarButtons.forEach((btn) => {
    const win = document.getElementById(btn.dataset.target);
    if (!win) return;

    // Start windows closed
    win.style.display = 'none';

    btn.addEventListener('click', () => {
      const isCurrentlyOpen = win.style.display === 'block';
      win.style.display = isCurrentlyOpen ? 'none' : 'block';
      btn.classList.toggle('open', !isCurrentlyOpen);

      // Bring window to front when opened
      if (!isCurrentlyOpen) {
        win.style.zIndex = ++highestZ;
      }
    });
  });

  // ============================================================
  // Universal Close Buttons (Fixes Welcome & all other windows)
  // ============================================================
  document.querySelectorAll('.titlebar-buttons button').forEach((closeBtn) => {
    closeBtn.addEventListener('click', () => {
      // Find the window parent of this button
      const win = closeBtn.closest('#welcome-window, #about-window, #links-window, #message-window, #draw-window, #minesweeper-window');
      
      if (win) {
        win.style.display = 'none';

        // Un-highlight taskbar button if this window has one
        const taskbarBtn = document.querySelector(`.taskbar-btn[data-target="${win.id}"]`);
        if (taskbarBtn) {
          taskbarBtn.classList.remove('open');
        }
      }
    });
  });

  // ============================================================
  // Taskbar clock.
  // ============================================================
  const clock = document.getElementById('taskbar-clock');
  if (clock) {
    function tick() {
      clock.textContent = new Date().toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
      });
    }
    tick();
    setInterval(tick, 1000);
  }

});
</script>
</body>
</html>
