<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan Ellis</title>

<style>
  /* ============================================================
     CUSTOMIZE ME: change these and the whole page updates.
     ============================================================ */
  :root {
    --color-bg: #008080;      /* Windows 95 teal desktop background */
    --color-ink: #1E2A24;     /* text color + icon button background */
    --color-accent: #4B6B58;  /* icon button hover color */
    --color-muted: #6E7A73;   /* secondary text */

    --font-body: 'Helvetica Neue', Arial, sans-serif;
    --max-width: 480px;
    --icon-size: 46px;        /* size of each icon button */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; /* keep the draggable windows from creating scrollbars */
    padding-bottom: 36px; /* leave room above the taskbar */
  }

  .wrap {
    max-width: var(--max-width);
    padding: 2rem 1.5rem;
  }

  h1 {
    font-size: 1.6rem;
    margin: 0 0 0.75rem;
    letter-spacing: -0.01em;
    color: #ffffff;
    text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35);
  }

  p.intro {
    color: var(--color-muted);
    margin: 0 0 2rem;
    font-size: 1.05rem;
  }

  /* ============================================================
     Draggable window — Windows 95 style chrome
     ============================================================ */
  #links-window,
  #about-window,
  #message-window,
  #welcome-window {
    position: fixed;
    background: #C0C0C0;
    border-radius: 0;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #dfdfdf,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #ffffff;
    padding: 3px;
    user-select: none;
    width: max-content;
  }

  #links-window {
    top: 68%;
    left: 62%;
    transform: translate(-50%, -50%);
  }

  #about-window {
    top: 32%;
    left: 38%;
    transform: translate(-50%, -50%);
  }

    #welcome-window {
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
    }

  .window-titlebar {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 3px 3px 3px 6px;
    background: linear-gradient(90deg, #000080, #1084d0);
    cursor: grab;
  }

  .window-titlebar:active {
    cursor: grabbing;
  }

  .window-titlebar .title {
    flex: 1;
    color: #ffffff;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .titlebar-buttons {
    display: flex;
    gap: 2px;
  }

  .titlebar-buttons button {
    width: 16px;
    height: 14px;
    background: #C0C0C0;
    border: none;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
    font-family: Tahoma, sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    line-height: 1;
    color: #000000;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  .titlebar-buttons button:active {
    box-shadow:
      inset 1px 1px 0 #0a0a0a,
      inset -1px -1px 0 #ffffff;
  }

  .window-body {
    padding: 0.9rem;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
  }

  #about-window .window-body {
    max-width: 280px;
    font-size: 0.85rem;
    color: #000000;
    background: #ffffff;
    margin: 3px;
    padding: 0.9rem;
    box-shadow:
      inset 1px 1px 0 #808080,
      inset -1px -1px 0 #ffffff;
  }

  #about-window .window-body p {
    margin: 0;
  }

    #welcome-window .window-body {
        max-width: 280px;
        font-size: 0.85rem;
        color: #000;
        background: #ffffff;
        margin: 3px;
        padding: 0.9rem;
        box-shadow:
        inset 1px 1px 0 #808080,
        inset -1px -1px 0 #ffffff;
    }

    #welcome-window .window-body p {
        margin: 0;
    }

  /* ---------- Message window (send-to-Discord form) ---------- */
  #message-window {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  #message-window .window-body {
    background: #ffffff;
    margin: 3px;
    padding: 0.9rem;
    width: 260px;
    box-shadow:
      inset 1px 1px 0 #808080,
      inset -1px -1px 0 #ffffff;
  }

  .msg-field {
    display: block;
    font-size: 0.78rem;
    margin-bottom: 3px;
    color: #000000;
  }

  .msg-input,
  .msg-textarea {
    width: 100%;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
    font-size: 0.8rem;
    padding: 4px 5px;
    margin-bottom: 0.7rem;
    border: none;
    background: #ffffff;
    box-shadow:

      inset 1px 1px 0 #808080,
      inset -2px -2px 0 #dfdfdf,
      inset 2px 2px 0 #0a0a0a;
  }

  .msg-textarea {
    resize: vertical;
    min-height: 70px;
  }

  .msg-send {
    display: block;
    margin-left: auto;
    padding: 4px 14px;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
    font-size: 0.8rem;
    background: #C0C0C0;
    border: none;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
    cursor: default;
  }

  .msg-send:active {
    box-shadow:
      inset 1px 1px 0 #0a0a0a,
      inset -1px -1px 0 #ffffff;
  }

  .msg-status {
    margin-top: 0.6rem;
    font-size: 0.75rem;
    color: var(--color-muted);
    min-height: 1em;
  }

  /* Windows start closed; JS toggles this via inline display */
  #links-window,
  #about-window,
  #message-window {
    display: none;
  }

  /* ============================================================
     Taskbar — Windows 95 style
     ============================================================ */
  .taskbar {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 36px;
    background: #C0C0C0;
    box-shadow: inset 0 1px 0 #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 4px;
    font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
    z-index: 10;
  }

  .taskbar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 28px;
    padding: 0 10px;
    background: #C0C0C0;
    border: none;
    box-shadow:
      inset -1px -1px 0 #0a0a0a,
      inset 1px 1px 0 #ffffff,
      inset -2px -2px 0 #808080,
      inset 2px 2px 0 #dfdfdf;
    font-family: inherit;
    font-size: 0.78rem;
    color: #000000;
    cursor: default;
  }

  .taskbar-btn.start {
    font-weight: 700;
  }

  .taskbar-apps .taskbar-btn {
    width: 32px;
    padding: 0;
  }

  .taskbar-apps .taskbar-btn svg {
    width: 16px;
    height: 16px;
  }

  .taskbar-btn.open {
    box-shadow:
      inset 1px 1px 0 #0a0a0a,
      inset -1px -1px 0 #ffffff;
  }

  .taskbar-divider {
    width: 2px;
    height: 26px;
    box-shadow: inset -1px 0 0 #0a0a0a, inset 1px 0 0 #808080;
  }

  .taskbar-apps {
    display: flex;
    gap: 4px;
    flex: 1;
    overflow: hidden;
  }

  .taskbar-clock {
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 10px;
    box-shadow:
      inset 1px 1px 0 #808080,
      inset -1px -1px 0 #ffffff;

  /* ---------- Icon links ---------- */
  ul.links {

    margin: 0;

  ul.links a {

    justify-content: center;

    height: var(--icon-size);
    border-radius: 10px;
    background: var(--color-ink);

  }

  ul.links a:hover,
  ul.links a:focus-visible {
    background: var(--color-accent);
    transform: translateY(-2px);
  }

  ul.links svg {
    width: 22px;
    height: 22px;
    fill: #FFFFFF; /* plain white icons */
  }

  a:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
</style>
</head>

<!-- ============================================================
     Draggable window: send a message that arrives in your DMs.

     SETUP REQUIRED — read before this will work:
     Sending a DM (rather than posting to a channel) requires a
     Discord bot, and a bot's token must never live in this file
     or any client-side code — anyone visiting the page could
     view source and steal it, giving them full control of your
     bot. So this form talks to a small backend you deploy
     yourself, which holds the token safely and relays the
     message as a DM to your Discord ID.

     1. Deploy the included discord-dm-worker.js as a Cloudflare
        Worker (free tier). Instructions are in that file.
     2. Paste the Worker's URL into BACKEND_URL below, in place
        of "PASTE YOUR BACKEND URL HERE".
     ============================================================ -->
<div id="message-window">
  <div class="window-titlebar" data-drag-handle>
    <span class="title">send a message</span>
    <div class="titlebar-buttons">
      <button aria-hidden="true">_</button>
      <button aria-hidden="true">□</button>
      <button aria-label="Close window">✕</button>
    </div>
  </div>
  <div class="window-body">
    <form id="message-form">
      <label class="msg-field" for="msg-name">Name</label>
      <input class="msg-input" type="text" id="msg-name" maxlength="60" required>

      <label class="msg-field" for="msg-body">Message</label>
      <textarea class="msg-textarea" id="msg-body" maxlength="1000" required></textarea>

      <button class="msg-send" type="submit">Send</button>
      <div class="msg-status" id="msg-status"></div>
    </form>
  </div>
</div>

<script>
// Replace this with your actual Cloudflare Worker URL
const BACKEND_URL = 'https://portfolio-backend.YOUR_USERNAME.workers.dev';

(function () {
  const form = document.getElementById('message-form');
  const status = document.getElementById('msg-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('msg-name').value.trim();
    const body = document.getElementById('msg-body').value.trim();

    if (!name || !body) return;

    status.textContent = 'Sending...';

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        // We only send the raw data; the Worker formats it for Discord
        body: JSON.stringify({
          name: name,
          message: body
        })
      });

      if (res.ok) {
        status.textContent = 'Sent!';
        form.reset();
      } else {
        const text = await res.text();
        console.log(res.status, text);
        status.textContent = `Error ${res.status}`;
      }
    } catch (err) {
      status.textContent = 'Network error.';
      console.error(err);
    }
  });
})();
</script>

<script>
  // ============================================================
  // Drag behavior for windows.
  // Drag by each window's title bar; position is clamped to
  // stay on screen. Works for any number of ".window" elements.
  // ============================================================
  (function () {

    let highestZ = 100;
    
    document.querySelectorAll('#about-window, #links-window, #message-window, #welcome-window').forEach(makeDraggable);

    function makeDraggable(win) {
      const bar = win.querySelector('[data-drag-handle]');
      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;

      win.addEventListener('mousedown', () => {
        win.style.zIndex = ++highestZ;
      });

      win.addEventListener('touchstart', () => {
        win.style.zIndex = ++highestZ;
      }, { passive: true });

      function startDrag(clientX, clientY) {
        const rect = win.getBoundingClientRect();
        win.style.zIndex = ++highestZ;
        dragging = true;
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        // Switch from centered transform to absolute top/left so dragging is direct.
        win.style.left = rect.left + 'px';
        win.style.top = rect.top + 'px';
        win.style.transform = 'none';
      }

      function moveDrag(clientX, clientY) {
        if (!dragging) return;
        const maxX = window.innerWidth - win.offsetWidth;
        const maxY = window.innerHeight - win.offsetHeight;
        const x = Math.min(Math.max(0, clientX - offsetX), maxX);
        const y = Math.min(Math.max(0, clientY - offsetY), maxY);
        win.style.left = x + 'px';
        win.style.top = y + 'px';
      }

      function endDrag() {
        dragging = false;
      }

      // Mouse
      bar.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
      window.addEventListener('mouseup', endDrag);

      // Touch
      bar.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        startDrag(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        moveDrag(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchend', endDrag);
    }
  })();

  // ============================================================
  // Taskbar: open/close windows.
  // Windows start closed. State is tracked explicitly in JS
  // (rather than inferred from inline styles) so every click
  // behaves consistently.
  // ============================================================
    (function () {

    const taskbarButtons =
        document.querySelectorAll('.taskbar-btn[data-target]');

    const welcome = document.getElementById('welcome-window');

    taskbarButtons.forEach((btn) => {
      const win = document.getElementById(btn.dataset.target);
      if (!win) return;

      let isOpen = false; // explicit state, not inferred from the DOM

      function setOpen(open) {
        isOpen = open;
        win.style.display = open ? 'block' : 'none';
        btn.classList.toggle('open', open);
      }

      setOpen(false); // enforce closed starting state

      btn.addEventListener('click', () => {
        setOpen(!isOpen);
        });

      // Wire up this window's title-bar ✕ button to close it.
      const closeBtn = win.querySelector('.titlebar-buttons button:last-child');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => setOpen(false));
      }
    });
  })();

  // ============================================================
  // Taskbar clock. Updates every second; swap the options below
  // for a different time format.
  // ============================================================
  (function () {
    const clock = document.getElementById('taskbar-clock');
    if (!clock) return;

    function tick() {
      clock.textContent = new Date().toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
